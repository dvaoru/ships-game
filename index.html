<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<!-- Область игры задаётся окном браузера или iframe itch.io. -->
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Little Ships Online</title>
	<style>
		html,
		body {
			background: #000;
			width: 100%;
			height: 100%;
			overflow: hidden;
			padding: 0;
			margin: 0;
		}

		div#gameContainer {
			background: transparent !important;
			position: absolute;
			top: 0;
			left: 0;
		}

		div#gameContainer canvas {
			position: absolute;
			display: block;
			-webkit-user-select: none;
			user-select: none;
		}

		div#gameContainer canvas[data-pixel-art="true"] {
			position: absolute;
			image-rendering: optimizeSpeed;
			image-rendering: -webkit-crisp-edges;
			image-rendering: -moz-crisp-edges;
			image-rendering: -o-crisp-edges;
			image-rendering: crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: optimize-contrast;
			image-rendering: pixelated;
			-ms-interpolation-mode: nearest-neighbor;
		}
	</style>
</head>

<body>
	<div id="gameContainer">
		<canvas id="unity-canvas" width="960" height="600" data-pixel-art=""></canvas>
		<script src="Build/ships-game.loader.js"></script>
		<script>
			var canvas = document.querySelector("#unity-canvas");
			var config = {
				dataUrl: "Build/ships-game.data",
				frameworkUrl: "Build/ships-game.framework.js",
				codeUrl: "Build/ships-game.wasm",
				streamingAssetsUrl: "StreamingAssets",
				companyName: "DefaultCompany",
				productName: "Little Ships Online",
				productVersion: "0.1.0",
				autoSyncPersistentDataPath: true,
			};
			var scaleToFit;
			try {
				scaleToFit = !!JSON.parse("");
			} catch (e) {
				scaleToFit = true;
			}
			function progressHandler(progress) {
				var percent = progress * 100 + '%';
				canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
				canvas.style.backgroundSize = '100% 1rem';
			}
			function onResize() {
				var container = canvas.parentElement;
				var w;
				var h;

				if (scaleToFit) {
					// Unity подстраивает разрешение под canvas; фиксированные пропорции оставляли полосы.
					w = window.innerWidth;
					h = window.innerHeight;
				} else {
					w = 960;
					h = 600;
				}

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = scaleToFit ? "0px" : Math.floor((window.innerHeight - h) / 2) + "px";
				container.style.left = scaleToFit ? "0px" : Math.floor((window.innerWidth - w) / 2) + "px";
				window.focus();
			}
			createUnityInstance(canvas, config, progressHandler).then(function (instance) {
				canvas = instance.Module.canvas;
				onResize();
			});
			window.addEventListener('resize', onResize);
			document.addEventListener('fullscreenchange', onResize);
			if (window.visualViewport) {
				window.visualViewport.addEventListener('resize', onResize);
			}
			onResize();
		</script>
	</div>

<script>console.log('%c' + '[PluginYG2 v2.0092] [Build: 33] [Platform: EmptyWebGL]', 'color: #FFDF73; background-color: #454545');</script>
</body>

</html>
